services:
  backend:
    build:
      context: ./backend
    container_name: riskguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - RISKGUARD_CORS_ORIGINS=["http://localhost:5173","http://localhost:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    container_name: riskguard-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
